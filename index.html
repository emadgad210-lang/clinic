<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#AD2227">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="جرد عماد الدين">
<link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0CAIAAACyr5FlAAAB40lEQVR4nO3Uuw3CQBQAQYyoxASmHvo09ZDQCzn2Sggk28FM+E73CVY3zON0gjXnvR/AcYmDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA7SZZtr7q/nx+RxvS1XV4dLP+z98uQNrvjz5C35OUjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA6SOEjiIImDJA7SMI/T3m/goPwcJHGQxEESB0kcJHGQxEESB0kcJHGQxEESB0kcJHGQxEESB0kcJHGQxEESB0kcJHGQxEESB0kcJHGQxEESB0kcJHGQxEESB0kcJHGQxEESB0kcJHGQxEESB0kcJHGQ3gb0JFW6qZasAAAAAElFTkSuQmCC">
<title>جرد عماد الدين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#ffffff;--tx:#2a1a1b;--mu:#7a5f60;--pr:#AD2227;--bd:#e9cfd0;--tint:rgba(173,34,39,.07);--ok:#AD2227;--er:#AD2227;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',system-ui,-apple-system,Tahoma,sans-serif;font-size:16px}
main{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:22px;margin:0 0 12px;background:var(--pr);color:#ffffff;padding:14px;border-radius:14px;text-align:center}
h2{font-size:16px;margin:0 0 8px}
button{font-family:inherit;font-size:inherit;border:0;border-radius:10px;padding:12px 14px;background:var(--pr);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--pr);border:1px solid var(--pr)}
button.big{width:100%;font-size:18px;padding:16px}
input,textarea{font-family:inherit;font-size:inherit;width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:#ffffff;color:var(--tx)}
textarea{min-height:90px}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.mu{color:var(--mu);font-size:14px}
.stats{display:flex;gap:8px}.stats div{flex:1;text-align:center;background:var(--tint);border-radius:10px;padding:8px}.stats b{display:block;font-size:20px}
#reader{width:100%;border-radius:10px;overflow:hidden}
.item{border:2px solid var(--pr);border-radius:12px;padding:12px;margin-top:10px}
.item .n{font-size:19px;font-weight:700}
.msg{margin-top:8px;font-size:14px}.err{color:var(--er)}.ok{color:var(--ok)}
.list{max-height:240px;overflow-y:auto}
.li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>جرد عماد الدين</h1>

<div class="card">
  <div class="stats"><div><b id="sTot">0</b><span class="mu">إجمالي الأصناف</span></div><div><b id="sDone">0</b><span class="mu">تم جردها</span></div></div>
</div>

<div class="card">
  <h2>1) تحميل الأصناف</h2>
  <p class="mu">ملف Excel/CSV: العمود الأول = الكود، والتاني = الاسم. أو الصق البيانات هنا (كل صنف في سطر: كود، اسم).</p>
  <input type="file" id="file" accept=".csv,.txt,.xlsx,.xls">
  <textarea id="paste" placeholder="1001, شاي ليبتون&#10;1002, سكر 1 كيلو" style="margin-top:8px"></textarea>
  <div class="row"><button id="imp">استيراد</button><button class="sec" id="clr">مسح كل البيانات</button></div>
  <div class="msg" id="impMsg"></div>
</div>

<div class="card">
  <h2>2) الجرد</h2>
  <button class="big" id="scanBtn">📷 افتح الكاميرا وامسح</button>
  <div id="reader" class="hide" style="margin-top:8px"></div>
  <button class="sec hide" id="stopBtn" style="margin-top:8px;width:100%">إغلاق الكاميرا</button>
  <div class="row"><input id="q" placeholder="أو اكتب الكود/الاسم للبحث" inputmode="search"><button id="goBtn" style="flex:0 0 auto">بحث</button></div>
  <div class="msg" id="msg"></div>
  <div id="item" class="item hide">
    <div class="n" id="iName"></div>
    <div class="mu">الكود: <span id="iCode"></span> — الجرد الحالي: <b id="iCur">-</b></div>
    <input id="qty" type="number" inputmode="decimal" placeholder="كمية الجرد" style="margin-top:8px;font-size:22px;text-align:center">
    <div class="row"><button id="save">حفظ ✔</button><button class="sec" id="addBtn">+ أضف للموجود</button></div>
  </div>
</div>

<div class="card">
  <h2>3) النتيجة</h2>
  <button class="big" id="exp">تصدير النتيجة (Excel)</button>
  <div class="list" id="list" style="margin-top:8px"></div>
</div>
<p class="mu">البيانات محفوظة على نفس الموبايل والمتصفح.</p>
<p class="mu" id="libs"></p>
</main>

<script>
const $=id=>document.getElementById(id);
let items=[],counts={},cur=null,scanner=null,stream=null,loopOn=false;
const K='inv_v1';
function load(){try{const d=JSON.parse(localStorage.getItem(K)||'null');if(d){items=d.items||[];counts=d.counts||{}}}catch(e){}}
function persist(){try{localStorage.setItem(K,JSON.stringify({items,counts}))}catch(e){$('msg').innerHTML='<span class="err">تعذر الحفظ على الجهاز</span>'}}
const norm=s=>String(s==null?'':s).trim();
const find=c=>items.find(i=>i.code.toLowerCase()===c.toLowerCase());
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){
  $('sTot').textContent=items.length;
  $('sDone').textContent=Object.keys(counts).length;
  $('list').innerHTML=Object.keys(counts).slice(-50).reverse().map(c=>{const it=find(c);return `<div class="li"><span>${esc(it?it.name:c)}<br><span class="mu">${esc(c)}</span></span><b>${counts[c]}</b></div>`}).join('')||'<span class="mu">لسه مفيش جرد</span>';
}
/* تحميل المكتبات مع بدائل */
function loadScript(urls){return new Promise(res=>{let i=0;(function nx(){if(i>=urls.length)return res(false);const s=document.createElement('script');s.src=urls[i++];s.onload=()=>res(true);s.onerror=()=>{s.remove();nx()};document.head.appendChild(s)})()})}
const libQR=loadScript(['https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js','https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js']);
const libX=loadScript(['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js']);
Promise.all([libQR,libX]).then(([a,b])=>{$('libs').textContent='الكاميرا: '+(a?'جاهزة':('BarcodeDetector' in window?'مدمجة':'غير متاحة'))+' | Excel القديم (xls): '+(b?'جاهز':'غير متاح')});

/* قراءة xlsx بدون مكتبات */
async function inflate(u8){const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function readXlsx(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf);
  let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('notzip');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let i=0;i<n;i++){
    const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    files[new TextDecoder().decode(u.subarray(p+46,p+46+nl))]={m,cs,off};p+=46+nl+el+cl;
  }
  async function get(name){const f=files[name];if(!f)return null;const o=f.off,st=o+30+dv.getUint16(o+26,true)+dv.getUint16(o+28,true);const d=u.subarray(st,st+f.cs);return new TextDecoder().decode(f.m===0?d:await inflate(d))}
  const xml=t=>new DOMParser().parseFromString(t,'application/xml');
  const ssT=await get('xl/sharedStrings.xml');const ss=[];
  if(ssT)for(const si of xml(ssT).getElementsByTagName('si'))ss.push(Array.from(si.getElementsByTagName('t')).map(t=>t.textContent).join(''));
  const sn=Object.keys(files).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort((a,b)=>parseInt(a.replace(/\D/g,''))-parseInt(b.replace(/\D/g,'')))[0];
  if(!sn)throw new Error('nosheet');
  const rows=[];
  for(const r of xml(await get(sn)).getElementsByTagName('row')){
    const row=[];
    for(const c of r.getElementsByTagName('c')){
      const ref=(c.getAttribute('r')||'').replace(/\d/g,'');let ci=0;for(const ch of ref)ci=ci*26+(ch.charCodeAt(0)-64);ci=Math.max(ci-1,0);
      const t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];let val='';
      if(t==='s')val=v?ss[parseInt(v.textContent)]:'';
      else if(t==='inlineStr')val=Array.from(c.getElementsByTagName('t')).map(x=>x.textContent).join('');
      else val=v?v.textContent:'';
      row[ci]=val;
    }
    rows.push(Array.from(row,x=>x==null?'':x));
  }
  return rows;
}
function rowsToItems(rows){
  const out=[];
  rows.forEach((r,idx)=>{
    const code=norm(r[0]),name=norm(r[1]);
    if(!code)return;
    if(idx===0&&/كود|code|barcode|باركود/i.test(code))return;
    out.push({code,name:name||code});
  });
  return out;
}
function parseText(t){
  return t.split(/\r?\n/).filter(l=>l.trim()).map(l=>{
    const sep=l.includes('\t')?'\t':(l.includes(',')?',':(l.includes(';')?';':null));
    if(!sep){const m=l.trim().match(/^(\S+)\s+(.+)$/);return m?[m[1],m[2]]:[l.trim(),'']}
    const p=l.split(sep);return [p[0].replace(/^"|"$/g,''),p.slice(1).join(sep).replace(/^"|"$/g,'')];
  });
}
function doImport(list){
  if(!list.length){$('impMsg').innerHTML='<span class="err">مفيش أصناف اتقرت، راجع الصيغة</span>';return}
  items=list;counts={};persist();render();
  $('impMsg').innerHTML=`<span class="ok">تم استيراد ${list.length} صنف</span>`;
}
$('imp').onclick=()=>{
  const f=$('file').files[0];
  $('impMsg').textContent='';
  if(f){
    const rd=new FileReader();
    if(/\.xlsx?$/i.test(f.name)){
      rd.onload=async e=>{
        let rows=null;
        try{rows=await readXlsx(e.target.result)}catch(x1){
          try{if(await libX&&window.XLSX){const wb=XLSX.read(e.target.result,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false})}}catch(x2){}
        }
        if(rows)doImport(rowsToItems(rows));
        else $('impMsg').innerHTML='<span class="err">تعذر قراءة ملف Excel. احفظه بصيغة xlsx أو CSV، أو الصق البيانات في المربع.</span>';
      };
      rd.onerror=()=>{$('impMsg').innerHTML='<span class="err">تعذر فتح الملف</span>'};
      rd.readAsArrayBuffer(f);
    }else{rd.onload=e=>doImport(rowsToItems(parseText(e.target.result)));rd.readAsText(f,'utf-8')}
  }else if(norm($('paste').value))doImport(rowsToItems(parseText($('paste').value)));
  else $('impMsg').innerHTML='<span class="err">اختار ملف أو الصق البيانات الأول</span>';
};
$('clr').onclick=()=>{if(confirm('هتمسح الأصناف وكل الجرد. متأكد؟')){items=[];counts={};persist();render();hideItem();$('impMsg').textContent=''}};
function hideItem(){$('item').classList.add('hide');cur=null}
function show(code){
  const it=find(code);
  if(!it){hideItem();$('msg').innerHTML=`<span class="err">الكود ${esc(code)} غير موجود في القائمة</span>`;return}
  cur=it;$('msg').textContent='';
  $('iName').textContent=it.name;$('iCode').textContent=it.code;
  $('iCur').textContent=counts[it.code]!==undefined?counts[it.code]:'-';
  $('qty').value=counts[it.code]!==undefined?counts[it.code]:'';
  $('item').classList.remove('hide');
  setTimeout(()=>{$('qty').focus();$('qty').select()},100);
}
function search(){
  const v=norm($('q').value);if(!v)return;
  if(find(v)){show(v);return}
  const m=items.filter(i=>i.name.toLowerCase().includes(v.toLowerCase())||i.code.includes(v));
  if(m.length===1)show(m[0].code);
  else if(m.length>1){hideItem();$('msg').innerHTML=m.slice(0,8).map(i=>`<div class="li" style="cursor:pointer" data-c="${esc(i.code)}"><span>${esc(i.name)}</span><span class="mu">${esc(i.code)}</span></div>`).join('')}
  else{hideItem();$('msg').innerHTML='<span class="err">مفيش نتيجة</span>'}
}
$('goBtn').onclick=search;
$('q').onkeydown=e=>{if(e.key==='Enter')search()};
$('msg').onclick=e=>{const d=e.target.closest('[data-c]');if(d)show(d.dataset.c)};
function commit(add){
  if(!cur)return;
  const v=parseFloat($('qty').value);
  if(isNaN(v)){$('msg').innerHTML='<span class="err">اكتب الكمية</span>';return}
  counts[cur.code]=add?(counts[cur.code]||0)+v:v;
  persist();render();
  $('msg').innerHTML=`<span class="ok">تم حفظ ${esc(cur.name)}: ${counts[cur.code]}</span>`;
  hideItem();$('q').value='';
}
$('save').onclick=()=>commit(false);
$('addBtn').onclick=()=>commit(true);
$('qty').onkeydown=e=>{if(e.key==='Enter')commit(false)};

/* الكاميرا */
async function nativeStart(){
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  const v=document.createElement('video');v.setAttribute('playsinline','');v.muted=true;v.style.width='100%';v.srcObject=stream;
  $('reader').innerHTML='';$('reader').appendChild(v);await v.play();
  const det=new BarcodeDetector();loopOn=true;
  (async function lp(){while(loopOn){try{const r=await det.detect(v);if(r.length){const t=r[0].rawValue;await stopScan();show(norm(t));return}}catch(e){}await new Promise(r=>setTimeout(r,200))}})();
}
async function startScan(){
  $('msg').innerHTML='<span class="mu">جاري تشغيل الكاميرا...</span>';
  $('reader').classList.remove('hide');$('stopBtn').classList.remove('hide');$('scanBtn').classList.add('hide');
  try{
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))throw new Error('NOCAM');
    const ok=await libQR;
    if(ok&&window.Html5Qrcode){
      scanner=new Html5Qrcode('reader');
      await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:140}},async txt=>{await stopScan();show(norm(txt))},()=>{});
      $('msg').textContent='';
    }else if('BarcodeDetector' in window){await nativeStart();$('msg').textContent=''}
    else throw new Error('NOLIB');
  }catch(e){
    await stopScan();
    const t=String(e&&/^(NOLIB|NOCAM)$/.test(e.message)?e.message:(e&&(e.name||e.message))||e);
    let m='تعذر فتح الكاميرا ('+esc(t)+').';
    if(/NotAllowed|Permission/i.test(t))m='الكاميرا مرفوضة. اسمح للمتصفح باستخدام الكاميرا من إعدادات الموقع.';
    else if(/NOLIB/.test(t))m='مكتبة قراءة الباركود ما اتحملتش (تأكد من الإنترنت). استخدم البحث بالكود لحد ما تشتغل.';
    else if(/NOCAM/.test(t))m='الكاميرا غير متاحة في الطريقة دي لفتح الصفحة. افتح اللينك في Safari أو Chrome مباشرة (HTTPS) مش من ملف محمّل أو من داخل تطبيق.';
    $('msg').innerHTML='<span class="err">'+m+'</span>';
  }
}
async function stopScan(){
  loopOn=false;
  try{if(scanner){await scanner.stop();scanner.clear()}}catch(e){}
  scanner=null;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  $('reader').innerHTML='';$('reader').classList.add('hide');$('stopBtn').classList.add('hide');$('scanBtn').classList.remove('hide');
}
$('scanBtn').onclick=startScan;$('stopBtn').onclick=stopScan;

/* التصدير: ملف Excel حقيقي (xlsx) بدون أي مكتبة خارجية */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}})();
function zipStore(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  for(const f of files){
    const nm=enc.encode(f.name),d=enc.encode(f.data),crc=CRC(d);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,d.length,true);lh.setUint32(22,d.length,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,d);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+d.length;
  }
  const cl=cen.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cl,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function buildXlsx(rows){
  const x=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const colL=i=>String.fromCharCode(65+i);
  const sheet=rows.map((r,ri)=>'<row r="'+(ri+1)+'">'+r.map((v,ci)=>{
    const ref=colL(ci)+(ri+1);
    if(v===''||v==null)return '';
    if(ri>0&&ci===2&&typeof v==='number')return '<c r="'+ref+'"><v>'+v+'</v></c>';
    return '<c r="'+ref+'" t="inlineStr"'+(ri===0?' s="1"':'')+'><is><t xml:space="preserve">'+x(v)+'</t></is></c>';
  }).join('')+'</row>').join('');
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  return zipStore([
    {name:'[Content_Types].xml',data:H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name:'_rels/.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml',data:H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="الجرد" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:'xl/styles.xml',data:H+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
    {name:'xl/worksheets/sheet1.xml',data:H+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews><cols><col min="1" max="1" width="40" customWidth="1"/><col min="2" max="2" width="22" customWidth="1"/><col min="3" max="3" width="14" customWidth="1"/></cols><sheetData>'+sheet+'</sheetData></worksheet>'}
  ]);
}
$('exp').onclick=async()=>{
  if(!items.length&&!Object.keys(counts).length){$('msg').innerHTML='<span class="err">مفيش أصناف للتصدير</span>';return}
  const num=v=>{if(v===undefined||v==='')return '';const n=Number(v);return isNaN(n)?v:n};
  const rows=[['اسم الصنف','الكود','كمية الجرد']].concat(items.map(i=>[i.name,i.code,num(counts[i.code])]));
  Object.keys(counts).forEach(c=>{if(!find(c))rows.push(['(غير موجود في القائمة)',c,num(counts[c])])});
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const fn='جرد-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.xlsx';
  const blob=buildXlsx(rows),file=new File([blob],fn,{type:blob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
};
load();render();
</script>
